name: taskpro

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/entrypoint.sh"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./backend/sqlserver/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: TaskPro.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=TaskPro;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: taskpro
      Mongo__TaskCommentsCollection: taskComments
      Jwt__Issuer: TaskPro
      Jwt__Audience: TaskPro
      Jwt__SigningKey: CHANGE_ME_DEV_SIGNING_KEY_32+_CHARS
    ports:
      - "7198:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:7198/api
      NEXT_PUBLIC_USE_MOCK: "false"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqlserver-data:
  mongo-data:
